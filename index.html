<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Credly Badges</title>

<style>
    body {
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #fff;
    }

    /* 3 per row */
    .badge-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        max-width: 1300px;
        margin: auto;
    }

    .badge-card {
        background: #1c1c1c;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(255,255,255,0.08);
        transition: transform .2s ease, box-shadow .2s ease;
    }

    .badge-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 0 30px rgba(255,255,255,0.25);
    }

    .banner {
        width: 140px;
        height: 140px;
        border-radius: 12px;
        object-fit: cover;
        margin-bottom: 15px;
        background: #000;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    .title {
        font-size: 18px;
        text-align: center;
        margin-bottom: 6px;
    }

    .meta {
        text-align: center;
        color: #bbb;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .btn {
        display: block;
        text-align: center;
        background: #3a6df0;
        padding: 10px 0;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        margin-top: 10px;
        transition: background .2s;
    }

    .btn:hover {
        background: #5c87ff;
    }
</style>

</head>
<body>

<h1>My Credly Badges</h1>

<div id="badgeContainer" class="badge-grid">Loading badges...</div>

<script>
async function loadBadges() {
    try {
        const response = await fetch("badges.json");
        const json = await response.json();

        const list = json.data;

        const container = document.getElementById("badgeContainer");
        container.innerHTML = "";

        list.forEach(badge => {
            const item = document.createElement("div");
            item.className = "badge-card";

            item.innerHTML = `
                <img class="banner" src="${badge.image_url}" />

                <div class="title">${badge.badge_template.name}</div>

                <div class="meta">
                    ${badge.issued_at_date} • ${badge.issuer.entities[0].entity.name}
                </div>

                <a class="btn" href="https://www.credly.com/badges/${badge.id}/public_url" target="_blank">
                    View Badge
                </a>
            `;

            container.appendChild(item);
        });

    } catch (e) {
        document.getElementById("badgeContainer").innerHTML = "Failed to load badges ❌";
        console.error(e);
    }
}

loadBadges();
</script>

</body>
</html>
