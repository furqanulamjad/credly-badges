<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Credly Badges</title>

<style>
    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    /* GRID: 3 per row */
    .badge-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: auto;
    }

    .badge-card {
        background: #1a1a1a;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 0 20px rgba(255,255,255,0.05);
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .badge-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 25px rgba(255,255,255,0.25);
    }

    .badge-image {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 50%;
        margin-bottom: 15px;
        background: #000;
    }

    .date {
        color: #bbb;
        font-size: 14px;
    }

    .issuer {
        margin-top: 5px;
        font-size: 14px;
        color: #9bbcf8;
    }

    .description {
        font-size: 13px;
        margin: 10px 0 14px;
        color: #ddd;
        line-height: 1.4;
    }

    .btn {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 14px;
        background: #3a6df0;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn:hover {
        background: #5a85ff;
    }
</style>

</head>
<body>

<h1>My Credly Badges</h1>

<div id="badgeContainer" class="badge-grid">Loading badges...</div>

<script>
async function loadBadges() {
    try {
        const response = await fetch("badges.json");
        const data = await response.json();

        const container = document.getElementById("badgeContainer");
        container.innerHTML = "";

        data.data.forEach(badge => {
            const card = document.createElement("div");
            card.className = "badge-card";

            card.innerHTML = `
                <img src="${badge.image_url}" class="badge-image">

                <h3>${badge.badge_template.name}</h3>

                <p class="date">${badge.issued_at_date}</p>

                <p class="issuer">Issued by ${badge.issuer.entities[0].entity.name}</p>

                <p class="description">${badge.badge_template.description}</p>

                <a class="btn" href="https://www.credly.com/badges/${badge.id}/public_url" target="_blank">
                    View Badge
                </a>
            `;

            container.appendChild(card);
        });
    } catch (err) {
        document.getElementById("badgeContainer").innerHTML = "Failed to load badges ❌";
        console.error(err);
    }
}

loadBadges();
</script>

</body>
</html>
